version: '3.8'

services:
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: serve --location /data
    volumes:
      - oxigraph-data:/data
    restart: unless-stopped

  web:
    build: .
    volumes:
      - slop-data:/data/slops
    environment:
      - OXIGRAPH_URL=http://oxigraph:7878
      - SLOP_HOME=/data
    depends_on:
      - oxigraph
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  oxigraph-data:
  slop-data:
  caddy-data:
  caddy-config:
